name: Build poster q20 inverse v6

on:
  workflow_dispatch:
  push:
    branches:
      - poster/figure-curation-v2
    paths:
      - "tools/build_poster_q20_inverse_v4.py"
      - "tools/build_poster_q20_inverse_v5.py"
      - "tools/build_poster_q20_inverse_v6.py"
      - "figures/experimental/q20_aberration/single_mask/**"
      - "figures/experimental/q20_aberration/validation/**"
      - "figures/experimental/q20_aberration/reconstruction/**"
      - ".github/workflows/build_poster_q20_inverse_v6.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install render dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install matplotlib numpy pillow
      - name: Compile
        run: |
          python -m py_compile tools/build_poster_q20_inverse_v4.py
          python -m py_compile tools/build_poster_q20_inverse_v5.py
          python -m py_compile tools/build_poster_q20_inverse_v6.py
      - name: Build q20 correction figure with z metrics
        run: python tools/build_poster_q20_inverse_v6.py
      - name: Verify high-resolution export
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from PIL import Image
          root=Path('outputs/poster/q20_inverse_v6')
          png=root/'poster_q20_correction_visual_with_z_metrics.png'
          pdf=root/'poster_q20_correction_visual_with_z_metrics.pdf'
          m=json.loads((root/'manifest.json').read_text())
          if not png.exists() or not pdf.exists():
              raise SystemExit('missing final asset')
          with Image.open(png) as im:
              print('final PNG',im.size,im.info.get('dpi'))
              if min(im.size)<3500:
                  raise SystemExit(f'asset too small: {im.size}')
          required={'profiles versus z','similarity versus z','corrected XY/XZ'}
          if not required.issubset(set(m['visual_flow'])):
              raise SystemExit('versus-z evidence missing from manifest')
          if not m['scientific_provenance']['programmed_qtheta_removed_from_residual']:
              raise SystemExit('qtheta scope regression')
          PY
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: poster-q20-inverse-v6
          path: outputs/poster/q20_inverse_v6
          if-no-files-found: error
          retention-days: 14
