name: Lab measurement workflow
on:
  pull_request:
    paths:
      - 'vbb_study/lab/**'
      - 'lab_gui/**'
      - 'docs/lab_control/**'
      - 'tools/analyze_beam_walk.py'
      - 'tests/test_lab_workflow.py'
      - 'run_lab_*.py'
      - 'requirements-lab.txt'
      - '.github/workflows/lab_measurement_workflow.yml'
  push:
    branches: ['lab/measurement-correction-workflow']
  workflow_dispatch:
jobs:
  lab-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    env:
      PYTHONPATH: 'lab_gui:.'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt runtime libraries for headless Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install -r requirements-lab.txt pytest
      - run: python -m pytest tests/test_lab_workflow.py lab_gui/tests -q
      - run: python -m compileall -q vbb_study/lab lab_gui tools/analyze_beam_walk.py run_lab_gui.py run_lab_session.py
      - run: python run_lab_session.py demo lab_sessions/ci_demo
      - name: Unified lab-control replay smoke test
        run: |
          python lab_gui/run_labcontrol_cli.py status > /dev/null
          python lab_gui/run_labcontrol_cli.py run recover-q20 \
            --camera replay \
            --output "$RUNNER_TEMP/labcontrol-demo"
