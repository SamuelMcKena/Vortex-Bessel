name: Lab measurement workflow
on:
  pull_request:
    paths:
      - 'vbb_study/lab/**'
      - 'lab_gui/**'
      - 'tests/test_lab_workflow.py'
      - 'run_lab_*.py'
      - 'requirements-lab.txt'
      - '.github/workflows/lab_measurement_workflow.yml'
  push:
    branches: ['lab/measurement-correction-workflow']
  workflow_dispatch:
jobs:
  lab-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    env:
      PYTHONPATH: 'lab_gui:.'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-lab.txt pytest
      - run: python -m pytest tests/test_lab_workflow.py lab_gui/tests -q
      - run: python -m compileall -q vbb_study/lab lab_gui run_lab_gui.py run_lab_session.py
      - run: python run_lab_session.py demo lab_sessions/ci_demo
