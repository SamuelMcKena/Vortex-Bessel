name: Build axicon decentre presentation figure

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build_axicon_decentre_presentation.yml
      - tools/build_phase2j_presentation_suite.py
      - tools/build_phase2i_presentation_figures.py
      - tools/presentation_phase2j_style.py
      - vbb_study/digital_twin/vortex_system_route.py
      - vbb_study/digital_twin/vortex_continuous_propagation.py

permissions:
  contents: write

env:
  MPLBACKEND: Agg

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install numerical environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-report.txt
          python -m pip install -e . --no-deps

      - name: Render current V1 axicon decentre figure only
        run: |
          rm -rf outputs/figures/axicon_decentre_chat
          mkdir -p outputs/figures/axicon_decentre_chat
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('tools').resolve()))
          import build_phase2j_presentation_suite as suite
          import build_phase2i_presentation_figures as core

          out = Path('outputs/figures/axicon_decentre_chat')
          suite._patch_core_renderer()
          path, metrics = core.build_v1_decentre(out, 2048)
          target = out / '04_V1_axicon_decentre_fixed_lab_thermal_tight.png'
          if target.exists():
              target.unlink()
          path.replace(target)
          import json
          (out / '04_V1_axicon_decentre_metrics.json').write_text(
              json.dumps({
                  'source_commit': 'github_actions_head',
                  'grid_n': 2048,
                  'xy_display_policy': 'centroid-following crop with absolute laboratory x/y coordinates preserved',
                  'xy_halfwidth_m': suite.DECENTRE_XY_HALF_M,
                  'xz_policy': 'fixed laboratory y=0; unchanged; no per-z recentering',
                  'metrics': metrics,
              }, indent=2) + '\n', encoding='utf-8'
          )
          print(target)
          PY
          test -f outputs/figures/axicon_decentre_chat/04_V1_axicon_decentre_fixed_lab_thermal_tight.png

      - name: Upload exact figure artifact
        uses: actions/upload-artifact@v4
        with:
          name: axicon_decentre_presentation
          path: outputs/figures/axicon_decentre_chat/
          if-no-files-found: error

      - name: Promote current figure into repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p figures/presentation
          cp outputs/figures/axicon_decentre_chat/04_V1_axicon_decentre_fixed_lab_thermal_tight.png figures/presentation/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures/presentation/04_V1_axicon_decentre_fixed_lab_thermal_tight.png
          git commit -m 'Regenerate axicon decentre presentation figure' || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Record run id for chat retrieval
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p chat_axicon_decentre
          printf '%s\n' '${{ github.run_id }}' > chat_axicon_decentre/RUN_ID.txt
          git add chat_axicon_decentre/RUN_ID.txt
          git commit -m 'Record axicon decentre artifact run' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
