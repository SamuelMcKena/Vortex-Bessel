name: Build focused axicon presentation evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build_axicon_decentre_presentation.yml
      - tools/build_axicon_severe_tip_comparison.py
      - tools/build_axicon_presentation_evidence_v3.py
      - tools/build_phase2j_presentation_suite.py
      - tools/build_phase2i_presentation_figures.py
      - tools/presentation_phase2j_style.py
      - vbb_study/digital_twin/vortex_system_route.py
      - vbb_study/digital_twin/vortex_continuous_propagation.py

concurrency:
  group: focused-axicon-presentation
  cancel-in-progress: true

permissions:
  contents: write

env:
  MPLBACKEND: Agg

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record run id immediately for diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p chat_axicon_evidence
          printf '%s\n' '${{ github.run_id }}' > chat_axicon_evidence/RUN_ID.txt
          git add chat_axicon_evidence/RUN_ID.txt
          git commit -m 'Record severe-tip axicon evidence run start' || true
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install numerical environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-report.txt
          python -m pip install -e . --no-deps

      - name: Optimise severe-tip annular clearance and render at 2048 grid
        shell: bash
        run: |
          set -euo pipefail
          rm -rf outputs/figures/axicon_severe_tip
          python tools/build_axicon_severe_tip_comparison.py \
            --sweep-grid-n 1024 \
            --render-grid-n 2048 \
            --output-dir outputs/figures/axicon_severe_tip
          test -f outputs/figures/axicon_severe_tip/09_severe_tip_avoidance_xy_xz.png
          test -f outputs/figures/axicon_severe_tip/09b_severe_tip_avoidance_1D.png
          test "$(find outputs/figures/axicon_severe_tip -maxdepth 1 -type f | wc -l)" -eq 2

      - name: Upload exact GitHub-generated presentation files
        uses: actions/upload-artifact@v4
        with:
          name: axicon_severe_tip_evidence
          path: outputs/figures/axicon_severe_tip/
          if-no-files-found: error

      - name: Promote only XY XZ and 1D outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p figures/presentation chat_axicon_evidence
          rm -f \
            figures/presentation/09_tip_avoidance_three_way_audit.png \
            figures/presentation/09b_tip_avoidance_three_way_1D_intensity.png \
            figures/presentation/09c_tip_avoidance_transverse_1D_intensity.png \
            figures/presentation/10_hollow_tip_avoidance_radius_sweep.png \
            figures/presentation/hollow_tip_avoidance_sweep_manifest.json
          cp outputs/figures/axicon_severe_tip/09_severe_tip_avoidance_xy_xz.png figures/presentation/
          cp outputs/figures/axicon_severe_tip/09b_severe_tip_avoidance_1D.png figures/presentation/
          printf '%s\n' '${{ github.run_id }}' > chat_axicon_evidence/RUN_ID.txt
          git add figures/presentation chat_axicon_evidence/RUN_ID.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Promote severe rounded-tip comparison figures'
            git push origin HEAD:main
          fi
