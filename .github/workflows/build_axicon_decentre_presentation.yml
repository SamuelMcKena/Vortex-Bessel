name: Build focused axicon presentation evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build_axicon_decentre_presentation.yml
      - tools/build_axicon_presentation_evidence_v3.py
      - tools/build_phase2j_presentation_suite.py
      - tools/build_phase2i_presentation_figures.py
      - tools/presentation_phase2j_style.py
      - vbb_study/digital_twin/vortex_system_route.py
      - vbb_study/digital_twin/vortex_continuous_propagation.py

concurrency:
  group: focused-axicon-presentation
  cancel-in-progress: true

permissions:
  contents: write

env:
  MPLBACKEND: Agg

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install numerical environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-report.txt
          python -m pip install -e . --no-deps

      - name: Render final axicon presentation evidence
        run: |
          rm -rf outputs/figures/axicon_presentation_evidence
          python tools/build_axicon_presentation_evidence_v3.py \
            --grid-n 2048 \
            --output-dir outputs/figures/axicon_presentation_evidence
          for name in \
            04_V1_axicon_decentre_fixed_lab_thermal_tight.png \
            04b_V1_axicon_decentre_1D_intensity.png \
            05_V1_nonideal_tip_fixed_lab_thermal_tight.png \
            05b_V1_nonideal_tip_1D_intensity.png \
            09_tip_avoidance_three_way_audit.png \
            09b_tip_avoidance_three_way_1D_intensity.png \
            09c_tip_avoidance_transverse_1D_intensity.png \
            axicon_presentation_evidence_manifest.json; do
              test -f "outputs/figures/axicon_presentation_evidence/$name"
          done

      - name: Upload exact GitHub-generated artifact
        uses: actions/upload-artifact@v4
        with:
          name: axicon_presentation_evidence
          path: outputs/figures/axicon_presentation_evidence/
          if-no-files-found: error

      - name: Promote final outputs into canonical presentation library
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          mkdir -p figures/presentation
          cp outputs/figures/axicon_presentation_evidence/*.png figures/presentation/
          cp outputs/figures/axicon_presentation_evidence/axicon_presentation_evidence_manifest.json figures/presentation/
          printf '%s\n' '${{ github.run_id }}' > chat_axicon_evidence/RUN_ID.txt
          git add figures/presentation chat_axicon_evidence/RUN_ID.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Regenerate final axicon presentation evidence'
            git push origin HEAD:main
          fi
