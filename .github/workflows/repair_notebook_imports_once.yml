name: Repair migrated notebook imports once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair_notebook_imports_once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace stale Publication_Study imports in current notebooks
        shell: python
        run: |
          import json
          from pathlib import Path

          notebooks = [
              Path('notebooks/materials/01_material_proxy_fluence_and_thresholds.ipynb'),
              Path('notebooks/materials/02_material_calibration_template.ipynb'),
              Path('notebooks/materials/03_application_design_tables.ipynb'),
              Path('notebooks/scalar/02_scalar_ideal_vs_lab_diagnostics.ipynb'),
              Path('notebooks/scalar/03_scalar_robustness_and_self_healing.ipynb'),
              Path('notebooks/scalar/04_scalar_parameter_sweeps.ipynb'),
              Path('notebooks/scalar/05_scalar_validation_suite.ipynb'),
          ]
          old = 'from Publication_Study import publication_diagnostics as pdiag'
          new = 'import publication_diagnostics as pdiag'

          for path in notebooks:
              payload = json.loads(path.read_text(encoding='utf-8'))
              count = 0
              for cell in payload.get('cells', []):
                  if cell.get('cell_type') != 'code':
                      continue
                  source = cell.get('source', [])
                  if isinstance(source, str):
                      updated = source.replace(old, new)
                      count += source.count(old)
                      cell['source'] = updated
                  else:
                      updated = []
                      for line in source:
                          count += str(line).count(old)
                          updated.append(str(line).replace(old, new))
                      cell['source'] = updated
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one stale import, found {count}')
              path.write_text(json.dumps(payload, indent=1, ensure_ascii=False) + '\n', encoding='utf-8')
              print(f'updated {path}')

      - name: Verify notebook runtime paths
        run: python tools/audit_notebook_runtime_paths.py

      - name: Commit repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebooks/materials notebooks/scalar
          git commit -m "Fix Publication_Study imports in current notebooks"
          git push origin main
