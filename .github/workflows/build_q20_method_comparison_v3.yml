name: Build q20 correction method comparison v3

on:
  workflow_dispatch:
  push:
    branches:
      - poster/figure-curation-v2
    paths:
      - "tools/benchmark_q20_miao_vs_digital_twin.py"
      - "tools/benchmark_q20_miao_vs_digital_twin_v2.py"
      - "tools/benchmark_q20_miao_vs_digital_twin_v3.py"
      - "vbb_study/digital_twin/hierarchical_physical_fit.py"
      - "vbb_study/digital_twin/physical_error_inference.py"
      - "vbb_study/digital_twin/vortex_system_route.py"
      - "vbb_study/digital_twin/vortex_system_error_sweeps.py"
      - "notebooks/experimental/axicon_aberration_correction/miao_full_retrieval.py"
      - "notebooks/experimental/axicon_aberration_correction/modal_vortex_bessel.py"
      - ".github/workflows/build_q20_method_comparison_v3.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project and benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install matplotlib numpy pandas pillow scipy
      - name: Compile benchmark
        run: |
          python -m py_compile tools/benchmark_q20_miao_vs_digital_twin.py
          python -m py_compile tools/benchmark_q20_miao_vs_digital_twin_v2.py
          python -m py_compile tools/benchmark_q20_miao_vs_digital_twin_v3.py
      - name: Run piston-invariant q20 comparison
        run: python tools/benchmark_q20_miao_vs_digital_twin_v3.py
      - name: Verify outputs and report closure
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, math
          from PIL import Image
          root=Path('outputs/poster/q20_method_comparison_v3')
          s=json.loads((root/'summary.json').read_text())
          for name in ('q20_miao_vs_digital_twin_v2.png','q20_miao_vs_digital_twin_v2.pdf','comparison_metrics_vs_z.csv'):
              if not (root/name).exists(): raise SystemExit(f'missing {name}')
          with Image.open(root/'q20_miao_vs_digital_twin_v2.png') as im:
              print('figure',im.size,im.info.get('dpi'))
              if min(im.size)<4000: raise SystemExit(f'figure too small: {im.size}')
          c=s['synthetic_coordinate_calibration']
          print('calibration transform',c['selected_transform'])
          print('phase-shape RMSE rad',c['selected_phase_shape_rmse_rad'])
          print('known-phase before',c['known_phase_closure_before_correction'])
          print('known-phase after',c['known_phase_closure_after_correction'])
          print('selected physical parameters',s['physical_parameter_estimation']['selected'])
          print('aberrated',s['aberrated'])
          print('physical update only',s['physical_update_only'])
          print('Miao',s['miao_only']['mean_pearson_r'],s['miao_only']['mean_nrmse'])
          print('hybrid',s['hybrid']['mean_pearson_r'],s['hybrid']['mean_nrmse'])
          for method in ('aberrated','physical_update_only','miao_only','hybrid'):
              for key in ('mean_pearson_r','mean_nrmse'):
                  if not math.isfinite(float(s[method][key])): raise SystemExit('non-finite metric')
          PY
      - name: Upload comparison artifact
        uses: actions/upload-artifact@v4
        with:
          name: q20-method-comparison-v3
          path: outputs/poster/q20_method_comparison_v3
          if-no-files-found: error
          retention-days: 14
