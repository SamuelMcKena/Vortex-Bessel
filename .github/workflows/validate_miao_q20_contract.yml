name: Validate q20 Miao synthetic contract

on:
  workflow_dispatch:
  push:
    branches:
      - poster/figure-curation-v2
    paths:
      - "tools/validate_miao_q20_contract.py"
      - "tools/benchmark_q20_method_physics_v2.py"
      - "notebooks/experimental/axicon_aberration_correction/miao_full_retrieval.py"
      - ".github/workflows/validate_miao_q20_contract.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install matplotlib numpy pandas pillow scipy
      - name: Run q20 Miao contract test
        run: python tools/validate_miao_q20_contract.py
      - name: Inspect result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('outputs/validation/miao_q20_contract/summary.json').read_text())
          print(json.dumps(s,indent=2))
          # This is diagnostic: fail only if the implemented correction is worse
          # than doing nothing, or if its sign is clearly opposite to the truth.
          if s['retrieved_correction']['mean_pearson_r'] <= s['aberrated']['mean_pearson_r']:
              raise SystemExit('Miao contract failed: retrieved correction did not improve Pearson agreement')
          if s['phase_rms_if_sign_reversed_rad'] < s['phase_rms_to_exact_conjugate_rad']:
              raise SystemExit('Miao contract failed: correction sign convention appears reversed')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: miao-q20-contract
          path: outputs/validation/miao_q20_contract
          if-no-files-found: error
          retention-days: 14
