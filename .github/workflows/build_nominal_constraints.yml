name: Build nominal constraint comparison figures

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build_nominal_constraints.yml
      - tools/build_phase2l_nominal_constraints.py
      - tools/presentation_phase2j_style.py
      - vbb_study/digital_twin/vortex_system_route.py
      - vbb_study/digital_twin/vortex_beam_slm_errors.py
      - vbb_study/digital_twin/vortex_explicit_4f.py
      - vbb_study/slm_model.py

permissions:
  contents: write

env:
  MPLBACKEND: Agg

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install numerical environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-report.txt
          python -m pip install -e . --no-deps
      - name: Render nominal constraint figures
        run: |
          rm -rf outputs/figures/nominal_constraints
          python tools/build_phase2l_nominal_constraints.py \
            --grid-n 2048 \
            --output-dir outputs/figures/nominal_constraints
          test -f outputs/figures/nominal_constraints/01_ideal_vs_nominal_constraints_B0_V1_V3.png
          test -f outputs/figures/nominal_constraints/02_V3_propagation_ideal_vs_nominal.png
          test -f outputs/figures/nominal_constraints/03_constraint_ladder_SLM_4F.png
          test -f outputs/figures/nominal_constraints/nominal_constraints_manifest.json
      - name: Upload figures
        uses: actions/upload-artifact@v4
        with:
          name: nominal_constraint_figures
          path: outputs/figures/nominal_constraints/
          if-no-files-found: error
      - name: Promote figures into repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p figures/presentation/nominal_constraints
          cp outputs/figures/nominal_constraints/* figures/presentation/nominal_constraints/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures/presentation/nominal_constraints
          git commit -m 'Regenerate nominal experimental constraint figures' || true
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Record run id for chat retrieval
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p chat_nominal_constraints
          printf '%s\n' '${{ github.run_id }}' > chat_nominal_constraints/RUN_ID.txt
          git add chat_nominal_constraints/RUN_ID.txt
          git commit -m 'Record nominal constraint artifact run' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

