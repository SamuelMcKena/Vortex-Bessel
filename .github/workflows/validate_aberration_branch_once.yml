name: Validate aberration physics branch once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/validate_aberration_branch_once.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/physics-consistent-aberration-v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-report.txt
          python -m pip install -r notebooks/experimental/axicon_aberration_correction/requirements.txt

      - name: Compile new and affected physics code
        run: |
          python -m py_compile \
            notebooks/experimental/axicon_aberration_correction/physics_consistent_multiplane.py \
            notebooks/experimental/axicon_aberration_correction/global_multiplane_retrieval.py \
            notebooks/experimental/axicon_aberration_correction/modal_vortex_bessel.py \
            notebooks/experimental/axicon_aberration_correction/q20_modal_analysis.py \
            notebooks/experimental/axicon_aberration_correction/phase_error_recreation.py \
            notebooks/experimental/axicon_aberration_correction/single_mask_inverse_forward_test.py \
            notebooks/experimental/axicon_aberration_correction/comprehensive_error_validation.py

      - name: Run focused propagation and phase tests
        run: python -m pytest tests/test_physics_consistent_multiplane.py -q

      - name: Run existing axicon controller test
        run: python -m pytest notebooks/experimental/axicon_aberration_correction/test_iterative_correction_controller.py -q

      - name: Check notebook JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('notebooks/experimental/axicon_aberration_correction/Bessel_zscan_physics_consistent.ipynb')
          json.loads(p.read_text(encoding='utf-8'))
          print('canonical notebook JSON OK')
          PY
