name: Repair active paths once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair_active_paths_once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Canonicalise standalone runtime paths
        shell: python
        run: |
          from pathlib import Path

          def replace(path: str, pairs: list[tuple[str, str]]) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              original = text
              for old, new in pairs:
                  if old not in text:
                      print(f'NOTE {path}: pattern not present: {old[:80]!r}')
                  text = text.replace(old, new)
              if text != original:
                  p.write_text(text, encoding='utf-8')
                  print(f'updated {path}')
              else:
                  print(f'no change {path}')

          replace('interface_correction_diagnosis.py', [
              (
                  'import bessel_twin_core as bt\nimport Publication_Study.bessel_twin_core as bt_impl\nfrom Publication_Study.finalize_publication_outputs import finalize_outputs',
                  'import bessel_twin_core as bt\nbt_impl = bt\nfrom finalize_publication_outputs import finalize_outputs',
              ),
              ('Publication_Study/outputs/', 'outputs/'),
          ])

          replace('publication_diagnostics.py', [
              ('Publication_Study/outputs', 'outputs'),
          ])

          replace('vbb_study/vbb_train_viz.py', [
              ('Publication_Study/outputs/figures/stage_c', 'outputs/figures/stage_c'),
          ])

          replace('vbb_study/publication/quicklook.py', [
              ('Publication_Study/outputs/', 'outputs/'),
              ('Path("Publication_Study") / "outputs"', 'Path(__file__).resolve().parents[2] / "outputs"'),
          ])

      - name: Compile repaired files
        run: |
          python -m py_compile \
            interface_correction_diagnosis.py \
            publication_diagnostics.py \
            vbb_study/vbb_train_viz.py \
            vbb_study/publication/quicklook.py

      - name: Verify runtime imports and output defaults
        shell: bash
        run: |
          set -euo pipefail
          ! grep -n 'import Publication_Study' interface_correction_diagnosis.py
          ! grep -n 'Path("Publication_Study") / "outputs"' vbb_study/publication/quicklook.py
          ! grep -n 'Publication_Study/outputs/figures/stage_c' vbb_study/vbb_train_viz.py

      - name: Commit repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            interface_correction_diagnosis.py \
            publication_diagnostics.py \
            vbb_study/vbb_train_viz.py \
            vbb_study/publication/quicklook.py
          if git diff --cached --quiet; then
            echo "No active path repairs required."
            exit 0
          fi
          git commit -m "Canonicalise active runtime paths for standalone repository"
          git push origin main
