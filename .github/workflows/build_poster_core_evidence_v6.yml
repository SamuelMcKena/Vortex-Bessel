name: Build poster core evidence v6

on:
  workflow_dispatch:
  push:
    branches:
      - poster/figure-curation-v2
    paths:
      - "tools/build_poster_core_evidence_v4.py"
      - "tools/build_poster_core_evidence_v5.py"
      - "tools/build_poster_core_evidence_v6.py"
      - "vbb_study/digital_twin/physical_error_inference.py"
      - "tests/test_physical_error_inference.py"
      - ".github/workflows/build_poster_core_evidence_v6.yml"
      - "bessel_twin_core.py"
      - "publication_diagnostics.py"
      - "vbb_study/**"
      - "figures/experimental/q20_aberration/**"

permissions:
  contents: read

jobs:
  build-core-evidence-v6:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install current project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Compile inference and figure code
        run: |
          python -m py_compile vbb_study/digital_twin/physical_error_inference.py
          python -m py_compile tools/build_poster_core_evidence_v4.py
          python -m py_compile tools/build_poster_core_evidence_v5.py
          python -m py_compile tools/build_poster_core_evidence_v6.py

      - name: Run inference unit tests
        run: python -m pytest -q tests/test_physical_error_inference.py

      - name: Build poster core evidence v6
        run: python tools/build_poster_core_evidence_v6.py

      - name: List outputs
        if: always()
        run: find outputs/poster/core_evidence_v6 -maxdepth 1 -type f -printf "%f\t%k KB\n" | sort || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poster-core-evidence-v6
          path: outputs/poster/core_evidence_v6
          if-no-files-found: error
          retention-days: 14
