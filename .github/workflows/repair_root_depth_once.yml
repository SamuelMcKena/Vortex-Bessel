name: Repair standalone root depth once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair_root_depth_once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair two remaining fixed-depth root references
        shell: python
        run: |
          from pathlib import Path

          repairs = {
              Path('vbb_study/digital_twin/nathan_vector_hexagon.py'): ('.parents[3]', '.parents[2]'),
              Path('vbb_study/vbb_validation.py'): ('.parents[2]', '.parents[1]'),
          }
          for path, (old, new) in repairs.items():
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count == 0:
                  raise SystemExit(f'{path}: expected {old!r} but found none')
              path.write_text(text.replace(old, new), encoding='utf-8')
              print(f'{path}: replaced {count} occurrence(s) of {old} with {new}')

      - name: Compile and audit
        run: |
          python -m py_compile vbb_study/digital_twin/nathan_vector_hexagon.py vbb_study/vbb_validation.py
          python tools/audit_clean_layout.py

      - name: Commit repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vbb_study/digital_twin/nathan_vector_hexagon.py vbb_study/vbb_validation.py
          git commit -m "Fix remaining standalone repository root references"
          git push origin main
