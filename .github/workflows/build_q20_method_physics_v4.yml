name: Build q20 correction physics benchmark v4

on:
  workflow_dispatch:
  push:
    branches:
      - poster/figure-curation-v2
    paths:
      - "tools/benchmark_q20_method_physics_v4.py"
      - "tools/benchmark_q20_method_physics_v3.py"
      - "tools/benchmark_q20_method_physics_v2.py"
      - "tools/benchmark_q20_miao_vs_digital_twin.py"
      - "notebooks/experimental/axicon_aberration_correction/miao_full_retrieval.py"
      - ".github/workflows/build_q20_method_physics_v4.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install matplotlib numpy pandas pillow scipy
      - name: Compile
        run: python -m py_compile tools/benchmark_q20_method_physics_v4.py
      - name: Run illuminated-region benchmark
        run: python tools/benchmark_q20_method_physics_v4.py
      - name: Verify
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root=Path('outputs/poster/q20_method_comparison_v4')
          s=json.loads((root/'summary.json').read_text())
          print(json.dumps({
              'selected':s['physical_parameter_estimation']['selected'],
              'miao_z':s['miao_only']['selected_z_mm'],
              'hybrid_z':s['digital_twin_plus_miao']['selected_z_mm'],
              'aberrated':s['aberrated'],'miao':s['miao_only'],
              'hybrid':s['digital_twin_plus_miao'],'oracle':s['oracle_phase_only'],
          },indent=2))
          if s['physical_parameter_estimation']['selected'].get('beam_radius_scale') != 0.85:
              raise SystemExit('beam radius not recovered')
          if s['physical_parameter_estimation']['selected'].get('axicon_lateral_decentre_x') != 0.00025:
              raise SystemExit('axicon decentre not recovered')
          if s['digital_twin_plus_miao']['mean_pearson_r'] <= s['miao_only']['mean_pearson_r']:
              raise SystemExit('hybrid does not outperform Miao in Pearson agreement')
          if s['digital_twin_plus_miao']['mean_nrmse'] >= s['miao_only']['mean_nrmse']:
              raise SystemExit('hybrid does not outperform Miao in NRMSE')
          png=root/'q20_method_physics_v4.png'; pdf=root/'q20_method_physics_v4.pdf'
          if not png.exists() or not pdf.exists(): raise SystemExit('missing figures')
          with Image.open(png) as im:
              if min(im.size)<3500: raise SystemExit(f'figure too small: {im.size}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q20-method-physics-v4
          path: outputs/poster/q20_method_comparison_v4
          if-no-files-found: warn
          retention-days: 14
