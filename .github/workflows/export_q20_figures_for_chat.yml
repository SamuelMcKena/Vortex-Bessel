name: Export q20 figure sources for chat

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/export_q20_figures_for_chat.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Build compact current q20 chat figures
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image, ImageChops

          root = Path.cwd()
          out = root / 'figures/chat_q20_current'
          inline = root / 'figures/chat_q20_inline'
          embed = root / 'figures/chat_q20_embed'
          out.mkdir(parents=True, exist_ok=True)
          inline.mkdir(parents=True, exist_ok=True)
          embed.mkdir(parents=True, exist_ok=True)

          def trim_white(im, pad=24):
              rgb = im.convert('RGB')
              bg = Image.new('RGB', rgb.size, 'white')
              diff = ImageChops.difference(rgb, bg).convert('L')
              diff = diff.point(lambda p: 255 if p > 10 else 0)
              box = diff.getbbox()
              if not box:
                  return rgb
              l,t,r,b = box
              l=max(0,l-pad); t=max(0,t-pad); r=min(rgb.width,r+pad); b=min(rgb.height,b+pad)
              return rgb.crop((l,t,r,b))

          def save_small(im, name, max_w=1100, quality=72):
              im = trim_white(im)
              if im.width > max_w:
                  h = round(im.height * max_w / im.width)
                  im = im.resize((max_w, h), Image.Resampling.LANCZOS)
              im.save(out / name, 'JPEG', quality=quality, optimize=True, progressive=False)

          def save_inline(src, name, max_w=520, quality=18):
              im = Image.open(src).convert('RGB')
              if im.width > max_w:
                  h = round(im.height * max_w / im.width)
                  im = im.resize((max_w, h), Image.Resampling.LANCZOS)
              im.save(inline / name, 'JPEG', quality=quality, optimize=True, progressive=False)

          def save_embed(src, stem, max_w, quality=5):
              im = Image.open(src).convert('RGB')
              if im.width > max_w:
                  h = round(im.height * max_w / im.width)
                  im = im.resize((max_w, h), Image.Resampling.LANCZOS)
              dst = embed / f'{stem}.webp'
              im.save(dst, 'WEBP', quality=quality, method=6)
              print('embed', dst.name, im.size, dst.stat().st_size)

          prop = Image.open(root/'figures/experimental/q20_aberration/validation/all_z_full_signed_xz_yz_maps.png').convert('RGB')
          w,h = prop.size
          x0, x1 = int(0.002*w), int(0.218*w)
          save_small(prop.crop((x0, int(0.015*h), x1, int(0.53*h))), '01_measured_XZ_full_stack.jpg', max_w=950, quality=80)
          save_small(prop.crop((x0, int(0.47*h), x1, int(0.995*h))), '02_measured_YZ_full_stack.jpg', max_w=950, quality=80)

          phase = Image.open(root/'figures/experimental/q20_aberration/reconstruction/annular_aberration_phase.png').convert('RGB')
          save_small(phase, '03_constrained_annular_phase_diagnostic.jpg', max_w=1150, quality=82)

          single = Image.open(root/'figures/experimental/q20_aberration/single_mask/single_mask_signed_xz_yz.png').convert('RGB')
          save_small(single, '04_single_input_mask_forward_falsification.jpg', max_w=1400, quality=76)

          for name, width, quality in [
              ('01_measured_XZ_full_stack.jpg', 500, 20),
              ('02_measured_YZ_full_stack.jpg', 500, 20),
              ('03_constrained_annular_phase_diagnostic.jpg', 650, 18),
              ('04_single_input_mask_forward_falsification.jpg', 850, 14),
          ]:
              save_inline(out/name, name, max_w=width, quality=quality)

          save_embed(out/'01_measured_XZ_full_stack.jpg', '01_measured_XZ_full_stack', 420, 5)
          save_embed(out/'02_measured_YZ_full_stack.jpg', '02_measured_YZ_full_stack', 420, 5)
          save_embed(out/'03_constrained_annular_phase_diagnostic.jpg', '03_constrained_annular_phase_diagnostic', 500, 4)
          save_embed(out/'04_single_input_mask_forward_falsification.jpg', '04_single_input_mask_forward_falsification', 650, 3)

      - name: Commit compact q20 chat figures
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures/chat_q20_current figures/chat_q20_inline figures/chat_q20_embed
          if git diff --cached --quiet; then
            echo 'Compact q20 chat figures already current.'
            exit 0
          fi
          git commit -m 'Build current q20 chat figure previews'
          git pull --rebase origin main
          git push origin main
