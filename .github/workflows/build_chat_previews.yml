name: Build chat preview figures

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build_chat_previews.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  previews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Pillow
        run: python -m pip install pillow

      - name: Build compact previews and full-resolution display exports
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image

          root = Path.cwd()
          preview_out = root / 'figures/chat_previews'
          full_out = root / 'figures/chat_fullres'
          preview_out.mkdir(parents=True, exist_ok=True)
          full_out.mkdir(parents=True, exist_ok=True)

          # The old q20 chat exports were visually convenient but scientifically
          # ambiguous: one mixed measured/model reconstruction and the other was
          # a dense all-z comparison.  They are deliberately removed until the
          # complete 72-frame BMG stack has been rerun through the physics-safe
          # presentation rebuild.
          for stem in ('04_q20_reconstruction', '05_q20_xz_yz'):
              for folder, suffix in ((preview_out, '.jpg'), (full_out, '.webp')):
                  stale = folder / f'{stem}{suffix}'
                  if stale.exists():
                      stale.unlink()

          files = {
              '01_B0_V1_V3': root / 'figures/presentation/02_beam_profile_shaping_B0_V1_V3_thermal_tight.png',
              '02_axicon_decentre': root / 'figures/presentation/04_V1_axicon_decentre_fixed_lab_thermal_tight.png',
              '03_nonideal_tip': root / 'figures/presentation/05_V1_nonideal_tip_fixed_lab_thermal_tight.png',
          }

          for stem, src in files.items():
              original = Image.open(src).convert('RGB')

              preview = original.copy()
              max_w = 300
              if preview.width > max_w:
                  h = round(preview.height * max_w / preview.width)
                  preview = preview.resize((max_w, h), Image.Resampling.LANCZOS)
              preview_dst = preview_out / f'{stem}.jpg'
              preview.save(preview_dst, 'JPEG', quality=7, optimize=True, progressive=False)

              # Preserve exact source pixel dimensions. WebP compression is only
              # to keep the file small enough for direct in-chat rendering.
              full_dst = full_out / f'{stem}.webp'
              original.save(full_dst, 'WEBP', quality=12, method=6)
              print(stem, original.size, preview_dst.stat().st_size, full_dst.stat().st_size)

      - name: Commit display exports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A figures/chat_previews figures/chat_fullres
          if git diff --cached --quiet; then
            echo 'Chat display figures already current.'
            exit 0
          fi
          git commit -m 'Refresh chat display figures'
          git pull --rebase origin main
          git push origin main
