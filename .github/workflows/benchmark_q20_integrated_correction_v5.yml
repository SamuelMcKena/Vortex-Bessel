# Controlled synthetic comparison: paper retrieval vs digital-twin-assisted correction.
name: Benchmark integrated q20 correction v5

on:
  workflow_dispatch:
  push:
    branches:
      - poster/figure-curation-v2
    paths:
      - "tools/benchmark_q20_integrated_correction_v5.py"
      - "tools/benchmark_q20_full_model_phase_refinement_v1.py"
      - "vbb_study/digital_twin/physical_observable_fit.py"
      - "vbb_study/digital_twin/hierarchical_physical_fit.py"
      - ".github/workflows/benchmark_q20_integrated_correction_v5.yml"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install matplotlib numpy pandas pillow scipy
      - name: Compile
        run: python -m py_compile tools/benchmark_q20_integrated_correction_v5.py
      - name: Run integrated benchmark
        run: python tools/benchmark_q20_integrated_correction_v5.py
      - name: Verify truth recovery and held-out correction
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('outputs/validation/q20_integrated_correction_v5/summary.json').read_text())
          print(json.dumps({
            'physical':s['physical_parameter_estimation']['selected'],
            'phase_rms':s['full_model_residual_fit']['phase_rms_to_truth_rad'],
            'heldout':s['full_model_residual_fit']['heldout'],
            'distorted':s['distorted'],
            'miao_only':s['miao_only_metrics'],
            'model_plus_miao':s['physical_fit_plus_miao_metrics'],
            'model_plus_full':s['physical_fit_plus_full_model'],
          },indent=2))
          sel=s['physical_parameter_estimation']['selected']
          if sel.get('fourf_iris_radius_scale') != 0.85:
              raise SystemExit(f"iris radius recovery failed: {sel}")
          if sel.get('axicon_lateral_decentre_x') != 0.00025:
              raise SystemExit(f"axicon displacement recovery failed: {sel}")
          if s['full_model_residual_fit']['heldout']['mean_pearson_r'] < 0.97:
              raise SystemExit('residual fit does not generalize to held-out z planes')
          if s['full_model_residual_fit']['phase_rms_to_truth_rad'] > 0.08:
              raise SystemExit('residual phase recovery exceeds 0.08 rad RMS')
          if s['physical_fit_plus_miao_metrics']['mean_pearson_r'] <= s['miao_only_metrics']['mean_pearson_r']:
              raise SystemExit('physical fit + Miao does not improve Pearson r over Miao-only')
          if s['physical_fit_plus_full_model']['mean_pearson_r'] <= s['physical_fit_plus_miao_metrics']['mean_pearson_r']:
              raise SystemExit('full digital-twin residual fit does not improve on model + Miao')
          if s['physical_fit_plus_full_model']['mean_nrmse'] >= s['physical_fit_plus_miao_metrics']['mean_nrmse']:
              raise SystemExit('full digital-twin residual fit does not reduce NRMSE versus model + Miao')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q20-integrated-correction-v5
          path: outputs/validation/q20_integrated_correction_v5
          if-no-files-found: warn
          retention-days: 14
