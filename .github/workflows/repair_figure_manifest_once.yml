name: Repair figure manifest once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair_figure_manifest_once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair rejected q20 candidate status
        shell: python
        run: |
          import csv
          from pathlib import Path

          path = Path('figures/manifest.csv')
          with path.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
              fields = list(rows[0].keys())

          changed = 0
          for row in rows:
              source = row.get('source_path','').lower()
              name = row.get('path','').lower()
              if 'rejected_do_not_use' in source or 'candidate' in name:
                  row['status'] = 'rejected_engineering_evidence'
                  row['presentation_preferred'] = 'no'
                  row['notes'] = 'Rejected candidate retained only as controller/engineering evidence; do not present as a usable correction mask.'
                  changed += 1

          if changed == 0:
              raise SystemExit('No rejected candidate row found to repair')

          with path.open('w', newline='', encoding='utf-8') as f:
              writer = csv.DictWriter(f, fieldnames=fields)
              writer.writeheader()
              writer.writerows(rows)
          print('repaired rows:', changed)

      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair_figure_manifest_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures/manifest.csv .github/workflows/repair_figure_manifest_once.yml
          git commit -m 'Repair rejected q20 figure status'
          git pull --rebase origin main
          git push origin HEAD:main
