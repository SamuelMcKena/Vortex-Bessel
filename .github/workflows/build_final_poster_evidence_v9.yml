name: Build final poster evidence v9

on:
  workflow_dispatch:
  push:
    branches:
      - poster/figure-curation-v2
    paths:
      - "tools/benchmark_q20_integrated_correction_v6.py"
      - "tools/build_final_poster_evidence_v9.py"
      - "tools/build_phase2i_presentation_figures.py"
      - "tools/build_presentation_extended_evidence.py"
      - "tools/build_poster_core_evidence_v8.py"
      - "vbb_study/digital_twin/**"
      - ".github/workflows/build_final_poster_evidence_v9.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install matplotlib numpy pandas pillow scipy
      - name: Compile
        run: |
          python -m py_compile tools/benchmark_q20_integrated_correction_v6.py
          python -m py_compile tools/build_final_poster_evidence_v9.py
      - name: Run q20 SLM2 benchmark
        run: python tools/benchmark_q20_integrated_correction_v6.py
      - name: Verify q20 result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('outputs/validation/q20_integrated_correction_v6/summary.json').read_text())
          sel=s['physical_parameter_estimation']['selected']
          print(json.dumps({
            'physical': sel,
            'phase_rms_rad': s['full_model_residual_fit']['phase_rms_to_truth_rad'],
            'heldout': s['full_model_residual_fit']['heldout'],
            'distorted': s['distorted'],
            'physical_adjustment': s['physical_adjustment_only'],
            'physical_plus_miao': s['physical_fit_plus_miao_native_input'],
            'full_model_slm2': s['physical_fit_plus_full_model_slm2'],
            'oracle_slm2': s['oracle_slm2'],
          }, indent=2))
          if sel.get('fourf_iris_radius_scale') != 0.85:
              raise SystemExit(f"iris radius recovery failed: {sel}")
          if sel.get('axicon_lateral_decentre_x') != 0.00025:
              raise SystemExit(f"axicon displacement recovery failed: {sel}")
          if s['full_model_residual_fit']['heldout']['mean_pearson_r'] < 0.97:
              raise SystemExit('held-out residual fit is below 0.97')
          if s['full_model_residual_fit']['phase_rms_to_truth_rad'] > 0.08:
              raise SystemExit('residual phase error exceeds 0.08 rad RMS')
          if s['physical_fit_plus_full_model_slm2']['mean_pearson_r'] <= s['physical_fit_plus_miao_native_input']['mean_pearson_r']:
              raise SystemExit('SLM2 full-model correction does not improve on physical-fit + Miao baseline')
          if s['physical_fit_plus_full_model_slm2']['mean_nrmse'] >= s['physical_fit_plus_miao_native_input']['mean_nrmse']:
              raise SystemExit('SLM2 full-model correction does not reduce NRMSE')
          if s['oracle_slm2']['mean_pearson_r'] < 0.999:
              raise SystemExit('exact SLM2 conjugate closure failed')
          PY
      - name: Build poster figures
        run: python tools/build_final_poster_evidence_v9.py
      - name: Upload poster evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-poster-evidence-v9
          path: |
            outputs/poster/final_evidence_v9
            outputs/validation/q20_integrated_correction_v6/summary.json
            outputs/validation/q20_integrated_correction_v6/metrics_vs_z.csv
          if-no-files-found: warn
          retention-days: 14
