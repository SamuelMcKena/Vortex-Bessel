name: Validate direct Miao Eq3 modal contract

on:
  workflow_dispatch:
  push:
    branches:
      - poster/figure-curation-v2
    paths:
      - "tools/validate_miao_modal_equation_contract.py"
      - "notebooks/experimental/axicon_aberration_correction/miao_full_retrieval.py"
      - ".github/workflows/validate_miao_modal_equation_contract.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install numpy scipy
      - name: Run direct Eq3 contract
        run: python tools/validate_miao_modal_equation_contract.py
      - name: Verify modal inversion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('outputs/validation/miao_modal_equation_contract/summary.json').read_text())
          print(json.dumps(s,indent=2))
          if s['fit_corr'] < 0.995:
              raise SystemExit('Eq3 focal fit correlation is too low')
          if s['k_perp_fractional_error'] > 0.01:
              raise SystemExit('Eq3 k_perp recovery is outside 1%')
          if s['retrieved_input_phase_rms_rad'] > 0.12:
              raise SystemExit('Eq3 input phase recovery exceeds 0.12 rad RMS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: miao-modal-equation-contract
          path: outputs/validation/miao_modal_equation_contract
          if-no-files-found: warn
          retention-days: 14
