name: Short-Bessel design validation

on:
  push:
    branches:
      - feature/short-bessel-programmable-axicon
    paths:
      - 'vbb_study/short_bessel.py'
      - 'vbb_study/short_bessel_propagation.py'
      - 'vbb_study/short_bessel_realizability.py'
      - 'tools/run_short_bessel_design.py'
      - 'tools/run_short_bessel_propagation.py'
      - 'tools/run_short_bessel_realizability.py'
      - 'tests/test_short_bessel_design.py'
      - 'tests/test_short_bessel_realizability.py'
      - 'docs/102_short_bessel_programmable_axicon_design.md'
      - '.github/workflows/short_bessel_ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'vbb_study/short_bessel.py'
      - 'vbb_study/short_bessel_propagation.py'
      - 'vbb_study/short_bessel_realizability.py'
      - 'tools/run_short_bessel_design.py'
      - 'tools/run_short_bessel_propagation.py'
      - 'tools/run_short_bessel_realizability.py'
      - 'tests/test_short_bessel_design.py'
      - 'tests/test_short_bessel_realizability.py'
      - 'docs/102_short_bessel_programmable_axicon_design.md'
      - '.github/workflows/short_bessel_ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  short-bessel:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install numerical environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.4.1 scipy==1.17.0 matplotlib==3.10.8 pillow==12.1.0 pytest==9.0.3
          python -m pip install -e . --no-deps

      - name: Compile prototype
        run: |
          python -m compileall -q \
            vbb_study/short_bessel.py \
            vbb_study/short_bessel_propagation.py \
            vbb_study/short_bessel_realizability.py \
            tools/run_short_bessel_design.py \
            tools/run_short_bessel_propagation.py \
            tools/run_short_bessel_realizability.py \
            tests/test_short_bessel_design.py \
            tests/test_short_bessel_realizability.py

      - name: Run short-Bessel regression tests
        run: |
          python -m pytest \
            tests/test_short_bessel_design.py \
            tests/test_short_bessel_realizability.py \
            -q

      - name: Generate 5 um x 500 um design package
        run: |
          python tools/run_short_bessel_design.py \
            --fwhm-um 5 \
            --length-um 500 \
            --output-dir outputs/short_bessel_design_ci

      - name: Propagate 5 um x 500 um equivalent sample field
        run: |
          python tools/run_short_bessel_propagation.py \
            --fwhm-um 5 \
            --length-um 500 \
            --grid-n 513 \
            --dx-um 0.25 \
            --z-max-um 700 \
            --z-points 141 \
            --output-dir outputs/short_bessel_propagation_ci

      - name: Optimize propagated L50 and test B0 V1 V3
        run: |
          python tools/run_short_bessel_realizability.py \
            --fwhm-um 5 \
            --l50-um 500 \
            --output-dir outputs/short_bessel_realizability_ci

      - name: Upload design package
        uses: actions/upload-artifact@v4
        with:
          name: short-bessel-5um-500um-design
          path: outputs/short_bessel_design_ci/
          if-no-files-found: error

      - name: Upload propagation package
        uses: actions/upload-artifact@v4
        with:
          name: short-bessel-5um-500um-propagation
          path: outputs/short_bessel_propagation_ci/
          if-no-files-found: error

      - name: Upload realizability and vortex package
        uses: actions/upload-artifact@v4
        with:
          name: short-bessel-5um-500um-realizability-vortex
          path: outputs/short_bessel_realizability_ci/
          if-no-files-found: error
