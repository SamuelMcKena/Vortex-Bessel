name: Build poster error dictionary v1

on:
  workflow_dispatch:
  push:
    branches:
      - poster/figure-curation-v2
    paths:
      - "vbb_study/digital_twin/physical_error_dictionary.py"
      - "vbb_study/digital_twin/physical_error_inference.py"
      - "vbb_study/digital_twin/vortex_system_error_sweeps.py"
      - "vbb_study/digital_twin/vortex_system_route.py"
      - "vbb_study/digital_twin/vortex_beam_slm_errors.py"
      - "vbb_study/digital_twin/vortex_explicit_4f.py"
      - "tools/build_poster_core_evidence_v5.py"
      - "tools/build_poster_error_dictionary_v1.py"
      - "tests/test_physical_error_dictionary.py"
      - ".github/workflows/build_poster_error_dictionary_v1.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Compile new bridge and builder
        run: |
          python -m py_compile vbb_study/digital_twin/physical_error_dictionary.py
          python -m py_compile tools/build_poster_error_dictionary_v1.py

      - name: Run dictionary unit tests
        run: python -m pytest -q tests/test_physical_error_dictionary.py tests/test_physical_error_inference.py

      - name: Build error shootout and fitting benchmark
        run: python tools/build_poster_error_dictionary_v1.py

      - name: Show correction handoff
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('outputs/poster/error_dictionary_v1/10_correction_handoff_manifest.json')
          if p.exists():
              d = json.loads(p.read_text())
              print('accepted:', d['benchmark']['accepted_families'])
              print('recovery pass:', d['benchmark']['recovery_pass'])
              print('next residual phase stage:', d['residual_phase_stage']['authoritative_runner'])
          PY

      - name: List outputs
        if: always()
        run: find outputs/poster/error_dictionary_v1 -maxdepth 1 -type f -printf "%f\t%k KB\n" | sort || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poster-error-dictionary-v1
          path: outputs/poster/error_dictionary_v1
          if-no-files-found: error
          retention-days: 14
