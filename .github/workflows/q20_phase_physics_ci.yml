name: q20 phase physics CI

on:
  push:
    branches: [main]
    paths:
      - notebooks/experimental/axicon_aberration_correction/q20_phase_physics.py
      - notebooks/experimental/axicon_aberration_correction/single_transverse_phase_forward_test.py
      - notebooks/experimental/axicon_aberration_correction/rebuild_q20_presentation_from_bmg.py
      - tests/test_q20_phase_physics.py
      - .github/workflows/q20_phase_physics_ci.yml
  pull_request:
    paths:
      - notebooks/experimental/axicon_aberration_correction/q20_phase_physics.py
      - notebooks/experimental/axicon_aberration_correction/single_transverse_phase_forward_test.py
      - notebooks/experimental/axicon_aberration_correction/rebuild_q20_presentation_from_bmg.py
      - tests/test_q20_phase_physics.py
      - .github/workflows/q20_phase_physics_ci.yml

jobs:
  physics-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy pytest
      - name: Run q20 phase physics regression tests
        run: python -m pytest -q tests/test_q20_phase_physics.py
      - name: Compile q20 presentation modules
        run: |
          python -m py_compile notebooks/experimental/axicon_aberration_correction/q20_phase_physics.py
          python -m py_compile notebooks/experimental/axicon_aberration_correction/single_transverse_phase_forward_test.py
          python -m py_compile notebooks/experimental/axicon_aberration_correction/rebuild_q20_presentation_from_bmg.py
