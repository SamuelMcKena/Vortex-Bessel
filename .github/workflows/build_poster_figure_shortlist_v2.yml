name: Build poster figure shortlist v2

on:
  workflow_dispatch:
  push:
    branches:
      - poster/figure-curation-v2
    paths:
      - "tools/build_poster_figure_shortlist_v2.py"
      - ".github/workflows/build_poster_figure_shortlist_v2.yml"
      - "bessel_twin_core.py"
      - "publication_diagnostics.py"
      - "vbb_study/**"
      - "figures/presentation/**"
      - "figures/experimental/q20_aberration/**"

permissions:
  contents: read

jobs:
  build-shortlist:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install current project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Compile shortlist builder
        run: python -m py_compile tools/build_poster_figure_shortlist_v2.py

      - name: Build figure shortlist
        run: python tools/build_poster_figure_shortlist_v2.py

      - name: List outputs
        if: always()
        run: find outputs/poster/figure_shortlist_v2 -maxdepth 1 -type f -printf "%f\t%k KB\n" | sort || true

      - name: Upload shortlist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poster-figure-shortlist-v2
          path: outputs/poster/figure_shortlist_v2
          if-no-files-found: error
          retention-days: 14
