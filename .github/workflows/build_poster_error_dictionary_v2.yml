name: Build poster error dictionary v2

on:
  workflow_dispatch:
  push:
    branches:
      - poster/figure-curation-v2
    paths:
      - "tools/build_poster_error_dictionary_v2.py"
      - "vbb_study/digital_twin/vortex_system_error_sweeps.py"
      - "vbb_study/digital_twin/vortex_system_route.py"
      - "vbb_study/digital_twin/vortex_continuous_propagation.py"
      - "figures/experimental/q20_aberration/**"
      - ".github/workflows/build_poster_error_dictionary_v2.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pillow

      - name: Compile builder
        run: python -m py_compile tools/build_poster_error_dictionary_v2.py

      - name: Build high-resolution component-plane candidates
        run: python tools/build_poster_error_dictionary_v2.py

      - name: Verify final export resolution
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root = Path('outputs/poster/error_dictionary_v2')
          pngs = sorted(root.glob('candidate_*.png'))
          if not pngs:
              raise SystemExit('no candidate PNGs produced')
          for p in pngs:
              with Image.open(p) as im:
                  print(p.name, im.size, im.info.get('dpi'))
                  if min(im.size) < 1800:
                      raise SystemExit(f'{p.name} is too small for final curation')
          pdfs = sorted(root.glob('candidate_*.pdf'))
          if len(pdfs) != len(pngs):
              raise SystemExit('missing vector PDF counterpart')
          PY

      - name: List outputs
        if: always()
        run: find outputs/poster/error_dictionary_v2 -maxdepth 1 -type f -printf "%f\t%k KB\n" | sort || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poster-error-dictionary-v2
          path: outputs/poster/error_dictionary_v2
          if-no-files-found: error
          retention-days: 14
