name: Build poster hybrid correction v2

on:
  workflow_dispatch:
  push:
    branches:
      - poster/figure-curation-v2
    paths:
      - "vbb_study/digital_twin/hierarchical_physical_fit.py"
      - "tools/build_poster_physical_fit_v1.py"
      - "tools/build_poster_q20_inverse_v4.py"
      - "tools/build_poster_q20_inverse_v5.py"
      - "tools/build_poster_q20_inverse_v6.py"
      - "tools/build_poster_hybrid_correction_v1.py"
      - "tools/build_poster_hybrid_correction_v2.py"
      - "figures/experimental/q20_aberration/**"
      - ".github/workflows/build_poster_hybrid_correction_v2.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install matplotlib numpy pillow scipy
      - name: Compile
        run: |
          python -m py_compile vbb_study/digital_twin/hierarchical_physical_fit.py
          python -m py_compile tools/build_poster_hybrid_correction_v1.py
          python -m py_compile tools/build_poster_hybrid_correction_v2.py
      - name: Build refined integrated correction figure
        run: python tools/build_poster_hybrid_correction_v2.py
      - name: Verify integration and resolution
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from PIL import Image
          root=Path('outputs/poster/hybrid_correction_v2')
          m=json.loads((root/'manifest.json').read_text())
          png=root/'poster_hybrid_model_assisted_correction.png'
          pdf=root/'poster_hybrid_model_assisted_correction.pdf'
          if not png.exists() or not pdf.exists(): raise SystemExit('missing hybrid figure')
          with Image.open(png) as im:
              print('final PNG',im.size,im.info.get('dpi'))
              if min(im.size)<3500: raise SystemExit(f'asset too small: {im.size}')
          if m['model_registry_total'] < 40: raise SystemExit('physical model registry incomplete')
          fitted=set(m['physical_fit_validation']['fitted_families'])
          if fitted != {'beam_radius_scale','axicon_lateral_decentre_x'}:
              raise SystemExit(f'physical fit recovery regression: {fitted}')
          PY
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: poster-hybrid-correction-v2
          path: outputs/poster/hybrid_correction_v2
          if-no-files-found: error
          retention-days: 14
