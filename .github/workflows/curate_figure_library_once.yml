name: Curate canonical figure library

on:
  push:
    branches: [main]
    paths:
      - tools/curate_figure_library.py
      - .github/workflows/curate_figure_library_once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone current figure sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _figure_sources

          clone_first() {
            dest="$1"
            shift
            for branch in "$@"; do
              echo "Trying branch: $branch"
              if git clone --depth 1 --single-branch --branch "$branch" https://github.com/SamuelMcKena/phd-structured-beam-study.git "$dest"; then
                printf '%s\n' "$branch" > "$dest/.CURATED_SOURCE_BRANCH"
                return 0
              fi
              rm -rf "$dest"
            done
            return 1
          }

          clone_first _figure_sources/q20 agent/axicon-aberration-correction-study agent/axicon-aberration-correction-cleanup
          clone_first _figure_sources/phase2j phase2j-presentation-visual-refinement agent/phase2j-presentation-visual-refinement || true
          clone_first _figure_sources/phase2k agent/phase2k-mathematical-physics-correctness-audit || true

      - name: Curate figure library
        run: python tools/curate_figure_library.py

      - name: Add figure navigation to README
        shell: python
        run: |
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          line = '- `figures/` — curated canonical figure library with provenance/status manifest.\n'
          if line not in text:
              needle = '- `outputs/validation/` — governed machine-readable validation evidence retained from the audited codebase.\n'
              if needle in text:
                  text = text.replace(needle, needle + line)
              else:
                  text += '\n## Canonical figures\n\nSee `figures/README.md` and `figures/manifest.csv`.\n'
              path.write_text(text, encoding='utf-8')

      - name: Verify library
        shell: bash
        run: |
          set -euo pipefail
          test -f figures/README.md
          test -f figures/manifest.csv
          test -d figures/experimental/q20_aberration
          count=$(find figures -type f -name '*.png' | wc -l)
          echo "Curated PNG count: $count"
          test "$count" -ge 15
          ! find figures -type f | grep -E 'pre_realign|postcorrectionoutput1'

      - name: Commit curated library
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _figure_sources
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures README.md
          if git diff --cached --quiet; then
            echo 'No figure-library changes required.'
            exit 0
          fi
          git commit -m 'Curate canonical figure library'
          git push origin main
