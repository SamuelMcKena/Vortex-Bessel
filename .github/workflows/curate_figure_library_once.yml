name: Curate canonical figure library once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/curate_figure_library_once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch current historical figure sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _figure_sources

          clone_branch() {
            local dest="$1"; shift
            for branch in "$@"; do
              echo "Trying ${branch} -> ${dest}"
              if git clone --depth 1 --single-branch --branch "$branch" \
                https://github.com/SamuelMcKena/phd-structured-beam-study.git "$dest"; then
                echo "$branch" > "$dest/.CURATED_SOURCE_BRANCH"
                return 0
              fi
              rm -rf "$dest"
            done
            echo "Could not clone any requested branch for $dest" >&2
            return 1
          }

          clone_branch _figure_sources/q20 \
            agent/axicon-aberration-correction-study \
            agent/axicon-aberration-correction-cleanup

          clone_branch _figure_sources/phase2j \
            phase2j-presentation-visual-refinement \
            agent/phase2j-presentation-visual-refinement || true

          clone_branch _figure_sources/phase2k \
            agent/phase2k-mathematical-physics-correctness-audit || true

      - name: Build curated figure tree and manifest
        shell: python
        run: |
          from __future__ import annotations

          import csv
          import shutil
          from pathlib import Path

          repo = Path.cwd()
          out = repo / "figures"
          if out.exists():
              shutil.rmtree(out)
          out.mkdir(parents=True)

          rows: list[dict[str, str]] = []

          def branch_name(root: Path) -> str:
              marker = root / ".CURATED_SOURCE_BRANCH"
              return marker.read_text(encoding="utf-8").strip() if marker.exists() else "unknown"

          def copy_one(
              source: Path,
              destination: Path,
              *,
              topic: str,
              status: str,
              evidence_type: str,
              generator: str,
              source_root: Path,
              supersedes: str = "",
              presentation_preferred: bool = False,
              notes: str = "",
          ) -> None:
              if not source.is_file():
                  print(f"SKIP missing {source}")
                  return
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, destination)
              rows.append({
                  "id": destination.stem,
                  "path": destination.relative_to(repo).as_posix(),
                  "topic": topic,
                  "status": status,
                  "evidence_type": evidence_type,
                  "generator": generator,
                  "source_repo": "SamuelMcKena/phd-structured-beam-study",
                  "source_ref": branch_name(source_root),
                  "source_path": source.relative_to(source_root).as_posix(),
                  "supersedes": supersedes,
                  "presentation_preferred": "yes" if presentation_preferred else "no",
                  "notes": notes,
              })

          def find_one(root: Path, basename: str) -> Path | None:
              matches = [p for p in root.rglob(basename) if ".git" not in p.parts]
              if not matches:
                  return None
              # Prefer canonical/presentation-like paths over backup/archive paths.
              def score(p: Path) -> tuple[int, int, str]:
                  text = p.as_posix().lower()
                  penalty = sum(word in text for word in ("backup", "archive", "old", "debug", "quicklook"))
                  reward = sum(word in text for word in ("canonical", "presentation", "phase2j"))
                  return (penalty - reward, len(p.parts), text)
              return sorted(matches, key=score)[0]

          # -----------------------------------------------------------------
          # Current q=20 experimental aberration/correction figures.
          # New realigned, all-z validation and falsification outputs are the
          # canonical family. Pre-realignment and early root figures are not
          # copied into the clean library.
          # -----------------------------------------------------------------
          qroot = repo / "_figure_sources/q20"
          qfig = qroot / "notebooks/experimental/axicon_aberration_correction/figures/slm_closed_loop_alignment/modal_q20"
          qdst = out / "experimental/q20_aberration"

          q20_groups = {
              "reconstruction": [
                  ("annular_aberration_phase.png", "q20_modal_analysis.py", True),
                  ("modal_spectrum.png", "q20_modal_analysis.py", False),
                  ("polar_measured_fit_corrected.png", "q20_modal_analysis.py", True),
                  ("realigned_cartesian_xy_measured_fit_corrected_ideal.png", "q20_modal_analysis.py", True),
                  ("realigned_cartesian_xy_page_1.png", "q20_modal_analysis.py", False),
                  ("realigned_3d_intensity_isosurfaces.png", "q20_modal_analysis.py", True),
              ],
              "validation": [
                  ("realigned_signed_xz_yz_measured_corrected_ideal.png", "q20_modal_analysis.py", True),
                  ("realigned_cartesian_similarity_vs_z.png", "q20_modal_analysis.py", False),
                  ("realigned_profile_metrics_vs_z.png", "q20_modal_analysis.py", False),
                  ("comprehensive_error_validation/all_z_full_signed_xz_yz_maps.png", "comprehensive_error_validation.py", True),
                  ("comprehensive_error_validation/all_z_metrics_dashboard.png", "comprehensive_error_validation.py", True),
                  ("comprehensive_error_validation/measured_vs_corrected_3d_mesh.png", "comprehensive_error_validation.py", True),
                  ("comprehensive_error_validation/measured_beam_axis_trajectory.png", "comprehensive_error_validation.py", False),
                  ("comprehensive_error_validation/all_z_images_page_1.png", "comprehensive_error_validation.py", False),
              ],
              "phase_error_recreation": [
                  ("phase_error_recreation/phase_error_recreation_agreement_vs_z.png", "phase_error_recreation.py", True),
                  ("phase_error_recreation/phase_error_recreation_signed_xz_yz.png", "phase_error_recreation.py", True),
                  ("phase_error_recreation/phase_error_recreation_page_1.png", "phase_error_recreation.py", False),
              ],
              "single_mask": [
                  ("single_mask_inverse_forward_test/single_mask_metrics_vs_z.png", "single_mask_inverse_forward_test.py", True),
                  ("single_mask_inverse_forward_test/single_mask_signed_xz_yz.png", "single_mask_inverse_forward_test.py", True),
                  ("single_mask_inverse_forward_test/single_z_minus10_measured_ideal_inverse.png", "single_mask_inverse_forward_test.py", True),
                  ("single_z_double_confirmation_minus10.png", "single_z_double_confirmation.py", True),
              ],
              "closed_loop": [
                  ("iterative_closed_loop/iteration_000_gain_sweep.png", "iterative_correction_controller.py", True),
                  ("iterative_closed_loop/REJECTED_DO_NOT_USE_iteration_000_slm2_preview/NOMINAL_PREVIEW_NOT_FOR_DISPLAY_ITERATION_000_CANDIDATE_overview.png", "iterative_correction_controller.py", False),
              ],
              "slm_preview": [
                  ("UNCALIBRATED_DO_NOT_APPLY_q20_modal_correction.png", "q20_modal_analysis.py", False),
                  ("slm2_correction_only_preview/NOMINAL_PREVIEW_NOT_FOR_DISPLAY_SLM2_CORRECTION_ONLY_GAIN_0p20_overview.png", "slm2_complete_mask_preview.py", False),
                  ("slm2_preview/NOMINAL_PREVIEW_NOT_FOR_DISPLAY_SLM2_overview.png", "slm2_complete_mask_preview.py", False),
              ],
          }

          for group, items in q20_groups.items():
              for rel, generator, preferred in items:
                  src = qfig / rel
                  dest = qdst / group / Path(rel).name
                  evidence = "measured+model" if group in {"reconstruction", "validation"} else "model_inference"
                  if group in {"phase_error_recreation", "single_mask"}:
                      evidence = "falsification_test"
                  if group == "slm_preview" or "CANDIDATE" in rel:
                      evidence = "hardware_preview_not_validated"
                  copy_one(
                      src, dest,
                      topic=f"q20_aberration/{group}",
                      status="canonical" if group not in {"slm_preview"} else "secondary",
                      evidence_type=evidence,
                      generator=generator,
                      source_root=qroot,
                      supersedes="pre_realign_* and early/root q20 renders" if group in {"reconstruction", "validation"} else "",
                      presentation_preferred=preferred,
                      notes=(
                          "Not hardware-validated; requires calibrated SLM mapping/LUT and a fresh post-correction z-stack."
                          if evidence == "hardware_preview_not_validated"
                          else ""
                      ),
                  )

          # -----------------------------------------------------------------
          # Phase 2J presentation suite: copy the high-resolution canonical
          # visual family if that historical branch is available. These are
          # presentation-ready views, not a second physics engine.
          # -----------------------------------------------------------------
          p2j = repo / "_figure_sources/phase2j"
          p2j_names = [
              "fig_01_ideal_beam_profiles.png",
              "fig_02_one_beam_propagation_annotated.png",
              "fig_03_three_beam_taxonomy_contact_sheet.png",
              "fig_04_dual_slm_grating_vs_all_digital.png",
              "fig_05_full_optical_path_split_before_final_section.png",
              "fig_06_lab_perspective_quad_points.png",
              "fig_07_full_system_ideal_vs_error_comparison.png",
              "fig_08_through_sample_design_space.png",
              "fig_09_continuous_write_synopsis.png",
              "fig_10_sensitivity_synopsis.png",
          ]
          for name in p2j_names:
              src = find_one(p2j, name) if p2j.exists() else None
              if src is None:
                  print(f"SKIP phase2j {name}")
                  continue
              copy_one(
                  src,
                  out / "presentation" / name,
                  topic="presentation",
                  status="canonical",
                  evidence_type="model_or_governed_visualisation",
                  generator="tools/build_phase2j_presentation_suite.py",
                  source_root=p2j,
                  presentation_preferred=True,
                  notes="Presentation visual; quantitative claims remain governed by the underlying model/evidence outputs.",
              )

          # -----------------------------------------------------------------
          # Selected current Publication_Study-style outputs from Phase 2K.
          # Only copy recognisable current scientific figures; avoid report
          # screenshots, caches, archives and backup folders.
          # -----------------------------------------------------------------
          p2k = repo / "_figure_sources/phase2k"
          publication_targets = {
              "ideal_beams": [
                  "fig_01_nominal_intensity_cross_sections.png",
                  "fig_02_case_intensity_xy.png",
                  "fig_03_case_phase_wrapped.png",
                  "fig_08_case_longitudinal_xz.png",
                  "fig_09_case_radial_profiles.png",
              ],
              "lab_realism": [
                  "fig_03_ideal_vs_lab_propagation_xz.png",
                  "fig_04_ideal_vs_lab_intensity_xy.png",
              ],
              "system_errors/rounded_tip": ["fig_06_tip_rounding_sensitivity.png"],
              "materials": [
                  "fig_07_bgo_multi_pass_transmission.png",
                  "fig_05_rate_proxies_vs_axicon_angle.png",
              ],
          }
          if p2k.exists():
              for group, names in publication_targets.items():
                  for name in names:
                      src = find_one(p2k, name)
                      if src is None:
                          print(f"SKIP phase2k {name}")
                          continue
                      copy_one(
                          src,
                          out / "publication" / group / name,
                          topic=f"publication/{group}",
                          status="secondary",
                          evidence_type="model",
                          generator="current Publication_Study / Phase 2K workflow",
                          source_root=p2k,
                          presentation_preferred=False,
                          notes="Retained when useful; presentation/Phase 2J or regenerated current outputs take precedence where overlapping.",
                      )

          # Manifest.
          fieldnames = [
              "id", "path", "topic", "status", "evidence_type", "generator",
              "source_repo", "source_ref", "source_path", "supersedes",
              "presentation_preferred", "notes",
          ]
          with (out / "manifest.csv").open("w", newline="", encoding="utf-8") as handle:
              writer = csv.DictWriter(handle, fieldnames=fieldnames)
              writer.writeheader()
              writer.writerows(sorted(rows, key=lambda r: r["path"]))

          readme = '''# Canonical figure library

This directory contains the **current preferred visual outputs** for the Vortex-Bessel project. It is intentionally curated rather than being a dump of every historical render.

## Rule

If multiple historical versions of a figure exist, prefer the figure listed here and use `manifest.csv` to trace its generator/source. Old repositories remain the provenance archive.

## Layout

- `publication/` — selected reusable outputs from the maintained Publication_Study workflows.
- `presentation/` — high-resolution presentation-ready views from the current/refined presentation suite where available.
- `experimental/q20_aberration/reconstruction/` — current realigned modal-reconstruction figures.
- `experimental/q20_aberration/validation/` — all-z / Cartesian / 3-D validation diagnostics.
- `experimental/q20_aberration/phase_error_recreation/` — phase-error recreation/falsification outputs.
- `experimental/q20_aberration/single_mask/` — stricter single-input-mask forward tests.
- `experimental/q20_aberration/closed_loop/` — iterative controller/gain-selection diagnostics.
- `experimental/q20_aberration/slm_preview/` — uncalibrated SLM previews; **not hardware-validated correction**.

## q=20 claim boundary

Measured z-stack images are experimental evidence. Modal phase recovery and proposed correction maps are model inference. Phase-error recreation and the single-mask forward test are falsification tests. SLM previews are not hardware-ready until the phase LUT/stroke, illuminated footprint, parity/rotation and camera-to-SLM mapping are calibrated and a fresh post-correction z-stack verifies the result.

Pre-realignment q=20 renders and early `postcorrectionoutput1`-style figures are deliberately not promoted into this canonical library.

## Regeneration

The repository keeps the current code that generates these scientific workflows. `outputs/` remains for regenerated/transient results; `figures/` is the small committed library intended for navigation, comparison and presentation reuse.
'''
          (out / "README.md").write_text(readme, encoding="utf-8")
          print(f"Curated {len(rows)} figures")

      - name: Add figure navigation to README
        shell: python
        run: |
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          marker = '- `figures/` — curated canonical figure library with provenance/status manifest.\n'
          if marker not in text:
              needle = '- `outputs/validation/` — governed machine-readable validation evidence retained from the audited codebase.\n'
              if needle in text:
                  text = text.replace(needle, needle + marker)
              else:
                  text += '\n\n## Canonical figures\n\nSee `figures/README.md` and `figures/manifest.csv`.\n'
              path.write_text(text, encoding='utf-8')

      - name: Verify curated library
        shell: bash
        run: |
          set -euo pipefail
          test -f figures/README.md
          test -f figures/manifest.csv
          test -d figures/experimental/q20_aberration
          count=$(find figures -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' \) | wc -l)
          echo "Curated image count: $count"
          test "$count" -ge 15
          if find figures -type f | grep -E 'pre_realign|postcorrectionoutput1'; then
            echo 'Legacy q20 render leaked into canonical library' >&2
            exit 1
          fi

      - name: Commit curated figure library
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _figure_sources
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures README.md
          if git diff --cached --quiet; then
            echo 'No figure-library changes required.'
            exit 0
          fi
          git commit -m "Curate canonical figure library"
          git push origin main
