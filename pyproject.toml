[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vbb_study"
version = "0.1.0"
description = "Vortex-Bessel beam publication study tools and scalar engine."
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy==2.4.1",
    "scipy==1.17.0",
    "pandas==3.0.3",
    "matplotlib==3.10.8",
    "plotly==6.5.2",
    "nbformat==5.10.4",
    "pillow==12.1.0",
    "ipython==9.9.0",
]

[project.optional-dependencies]
dev = [
    "papermill",
    "ipykernel",
    "jupyter",
]
viz = [
    "colorcet>=3.1",
    "cmocean>=4.0",
]

[tool.setuptools]
py-modules = ["bessel_twin_core"]

[tool.setuptools.packages.find]
include = ["vbb_study*"]
